version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_USER: vacancy_user
      POSTGRES_PASSWORD: vacancy_pass
      POSTGRES_DB: vacancy_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: .
    command: python -m vacancyparse.app.scripts.run_migration
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://vacancy_user:vacancy_pass@db:5432/vacancy_db
    depends_on:
      - db
      - redis
    restart: "no"

  save_vacancy:
    build: .
    command: python -m vacancyparse.app.scripts.run_save_vacancy
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://vacancy_user:vacancy_pass@db:5432/vacancy_db
    depends_on:
      - db
      - redis
    restart: "no"

  bot:
    build: .
    command: python -m vacancyparse.app.scripts.run_bot
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://vacancy_user:vacancy_pass@db:5432/vacancy_db
    depends_on:
      - db
      - redis
    restart: always

  celery_worker:
    build: .
    command: celery -A vacancyparse.app.celery.celery_app worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - DATABASE_URL=postgresql+asyncpg://vacancy_user:vacancy_pass@db:5432/vacancy_db
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build: .
    command: celery -A vacancyparse.app.celery.celery_app beat
    volumes:
      - .:/app
      - celery_data:/celery_data
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      - CELERY_BEAT_SCHEDULE=/celery_data/celerybeat-schedule
      - DATABASE_URL=postgresql+asyncpg://vacancy_user:vacancy_pass@db:5432/vacancy_db
    depends_on:
      - db
      - redis
    restart: always
    user: "0:0"

volumes:
  redisdata:
  celery_data:
  pgdata:
